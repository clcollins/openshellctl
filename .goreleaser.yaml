# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/openshellctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.version={{ if .IsSnapshot }}{{.ShortCommit}}{{ else }}{{.Version}}{{ end }}
      - -X main.commit={{.ShortCommit}}
      - -X main.openshellPin={{.Env.OPENSHELL_PIN}}
      - "-extldflags=-zrelro"
      - "-extldflags=-znow"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

checksum:
  # Explicit template keeps the shape stable so selfupdate.ChecksumAssetName
  # can construct the filename without parsing the YAML at runtime.
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: openshift-online
    name: openshellctl
  # -rc.N tags become GitHub pre-releases so /releases/latest returns a stable
  # tag instead of an rc. The client also filters pre-releases by semver, but
  # the flag keeps the GitHub UI and install scripts consistent.
  prerelease: auto
  draft: false
