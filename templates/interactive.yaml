apiVersion: openshell.managed.openshift.io/v1alpha1
kind: Sandbox
metadata:
  name: ${NAME}
spec:
  image: quay.io/redhat-services-prod/rosa-tenant/rosa-agent/rosa-agent:latest
  command:
    - /bin/sh
    - -c
    - |
      echo "DEPRECATED: templates/interactive.yaml has moved out of openshellctl." >&2
      echo "Use openshift-online/rosa-agent's sandbox/templates/interactive.yaml instead:" >&2
      echo "  https://github.com/openshift-online/rosa-agent/blob/main/sandbox/templates/interactive.yaml" >&2
      echo "(ignored prompt: ${PROMPT})" >&2
      exit 1
  sessionOpts:
    noKeep: true
  tty: true
